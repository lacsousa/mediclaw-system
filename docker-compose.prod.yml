# docker-compose.prod.yml
# Stack de produção do MediClaw para o VPS Hostinger.
# Uso: ver DEPLOY.md na raiz do repo para o passo a passo completo.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Este VPS também hospeda outro projeto (llmscout.tech) com o Nginx do
# sistema (apt) + Certbot próprio ocupando as portas 80/443. Por isso o
# TLS/proxy reverso do MediClaw NÃO roda em container aqui — django-api e
# react-painel publicam suas portas só em 127.0.0.1, e quem fala com o
# mundo é o Nginx do sistema (configs em nginx/system/, ver DEPLOY.md).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mediclaw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mediclaw}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mediclaw]
    # Não publica porta no host: só django-api acessa, via rede interna.

  django-api:
    build:
      context: ./django-api
      dockerfile: Dockerfile.prod
    container_name: mediclaw_django
    restart: unless-stopped
    env_file:
      - ./django-api/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - chroma_data:/app/chroma_data
      - ./staticfiles:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mediclaw]
    # Publicada só em 127.0.0.1 — o Nginx do SISTEMA (fora do compose) faz o
    # proxy reverso para localhost:8000. "./staticfiles" é bind mount (não
    # volume nomeado) para o Nginx do sistema conseguir servir /static/
    # direto do disco, em vez de mexer com volumes Docker.

  react-painel:
    build:
      context: ./react-painel
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mediclaw.com.br}
    container_name: mediclaw_painel
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - django-api
    networks: [mediclaw]
    # Publicada só em 127.0.0.1 — o Nginx do SISTEMA faz o proxy reverso
    # para localhost:3000 (ver nginx/system/mediclaw.com.br.conf).

volumes:
  pgdata:
  chroma_data:

networks:
  mediclaw:
    name: mediclaw-prod-network
