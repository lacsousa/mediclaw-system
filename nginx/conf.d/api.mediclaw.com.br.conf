# ⚠️ NÃO USADO NESTE DEPLOY — mantido só como referência.
# Este VPS já roda outro projeto (llmscout.tech) com Nginx do SISTEMA +
# Certbot próprio nas portas 80/443. Por isso o MediClaw usa as configs em
# nginx/system/ (aplicadas no Nginx do host), não este container Nginx
# dockerizado. Ver DEPLOY.md, seção "1. Nginx do sistema".

# API (Django) — api.mediclaw.com.br

server {
    listen 80;
    listen [::]:80;
    server_name api.mediclaw.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.mediclaw.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.mediclaw.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mediclaw.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads (ex.: PDFs para a base de conhecimento do RAG) podem ser maiores.
    client_max_body_size 20m;

    # Estáticos do Django (admin, swagger) servidos direto pelo Nginx.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://django-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Respostas de chat/RAG podem demorar mais que o padrão de 60s.
        proxy_read_timeout 120s;
    }
}
