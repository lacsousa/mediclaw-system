# Painel (Next.js) — mediclaw.com.br e www.mediclaw.com.br

server {
    listen 80;
    listen [::]:80;
    server_name mediclaw.com.br www.mediclaw.com.br;

    # Necessário para o certbot renovar o certificado via webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mediclaw.com.br www.mediclaw.com.br;

    ssl_certificate     /etc/letsencrypt/live/mediclaw.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediclaw.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://react-painel:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
