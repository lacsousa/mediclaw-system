# /etc/nginx/sites-available/mediclaw.com.br
# Painel (Next.js) — mediclaw.com.br e www.mediclaw.com.br
#
# Config para o Nginx DO SISTEMA (apt), não o container docker-compose.
# django-api e react-painel publicam portas só em 127.0.0.1 (ver
# docker-compose.prod.yml). Depois de copiar este arquivo e dar symlink em
# sites-enabled, rode:
#   certbot --nginx -d mediclaw.com.br -d www.mediclaw.com.br
# O certbot edita este arquivo sozinho para adicionar o bloco 443/SSL e o
# redirect 80->443, no mesmo padrão já usado para llmscout.tech.

server {
    listen 80;
    listen [::]:80;
    server_name mediclaw.com.br www.mediclaw.com.br;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
