# /etc/nginx/sites-available/mediclaw.com.br
# Landing page de marketing (HTML estático, SEM build) — mediclaw.com.br
# (bare domain, sem www). O painel (Next.js) mudou para www.mediclaw.com.br
# — ver painel.mediclaw.com.br.conf.
#
# Config para o Nginx DO SISTEMA (apt), não o container docker-compose.
# O certificado já emitido cobre os dois nomes
# (certbot --nginx -d mediclaw.com.br -d www.mediclaw.com.br), então este
# vhost reaproveita os mesmos arquivos em /etc/letsencrypt/live/mediclaw.com.br/
# — não precisa reemitir nada. Ver DEPLOY.md, seção "Migração de vhost:
# landing no domínio raiz" para o passo a passo de aplicar isso no VPS.
#
# Conteúdo vem direto de /opt/mediclaw/marketing/landing (git pull já
# atualiza o HTML — sem build, sem restart de container, sem reload do
# Nginx necessário para trocar apenas o conteúdo).

server {
    listen 80;
    listen [::]:80;
    server_name mediclaw.com.br www.mediclaw.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mediclaw.com.br;

    ssl_certificate     /etc/letsencrypt/live/mediclaw.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediclaw.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/mediclaw/marketing/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
