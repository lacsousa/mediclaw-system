# /etc/nginx/sites-available/painel.mediclaw.com.br
# Painel (Next.js) — www.mediclaw.com.br
#
# O domínio raiz (mediclaw.com.br, sem www) agora serve a landing estática
# — ver mediclaw.com.br.conf. O redirect 80->443 para www.mediclaw.com.br
# já está coberto pelo bloco :80 de mediclaw.com.br.conf (mesmo
# server_name), então este arquivo só precisa do bloco 443.
#
# Config para o Nginx DO SISTEMA (apt), não o container docker-compose.
# react-painel publica a porta só em 127.0.0.1:3001 (ver
# docker-compose.prod.yml — 3001, não 3000: o llmscout.tech já ocupa
# 127.0.0.1:3000 neste VPS).
#
# Reaproveita o mesmo certificado de mediclaw.com.br.conf (SAN cobre
# mediclaw.com.br + www.mediclaw.com.br) — não precisa reemitir nada.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mediclaw.com.br;

    ssl_certificate     /etc/letsencrypt/live/mediclaw.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediclaw.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
