# /etc/nginx/sites-available/api.mediclaw.com.br
# API (Django) — api.mediclaw.com.br
#
# Config para o Nginx DO SISTEMA (apt), não o container docker-compose.
# django-api publica a porta só em 127.0.0.1:8000 (ver docker-compose.prod.yml).
# Depois de copiar este arquivo e dar symlink em sites-enabled, rode:
#   certbot --nginx -d api.mediclaw.com.br
# O certbot edita este arquivo sozinho para adicionar o bloco 443/SSL e o
# redirect 80->443, no mesmo padrão já usado para llmscout.tech.

server {
    listen 80;
    listen [::]:80;
    server_name api.mediclaw.com.br;

    client_max_body_size 20m;

    # Estáticos do Django (admin, swagger) — servidos direto do disco.
    # Caminho bate com o bind mount "./staticfiles" do docker-compose.prod.yml
    # dentro de /opt/mediclaw (ajuste se clonar em outro diretório).
    location /static/ {
        alias /opt/mediclaw/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Respostas de chat/RAG podem demorar mais que o padrão de 60s.
        proxy_read_timeout 120s;
    }
}
